<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Monyet Kelapa 4D ULTRA - Kampung Durian Runtuh</title>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;overflow:hidden;background:#000;font-family:system-ui;font-weight:900;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
.top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px}
.pill{background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);border-radius:100px;padding:10px 18px;box-shadow:0 8px 20px rgba(0,0,0,0.3);font-size:13px;border:2px solid #000}
#bar{position:absolute;top:58px;left:12px;right:12px;height:14px;background:#000;border-radius:20px;padding:3px}
#fill{height:100%;border-radius:20px;background:linear-gradient(90deg,#00ff88,#ffff00);width:100%;transition:0.2s}
.pad{position:absolute;bottom:14px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;pointer-events:auto}
.j{width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,0.9);backdrop-filter:blur(20px);border:3px solid #000;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 10px 0 #000;user-select:none}
.j:active{transform:translateY(8px);box-shadow:0 2px 0 #000}
#climbBtn{width:160px;height:92px;border-radius:30px;background:linear-gradient(#00ff88,#00cc66);color:#000;font-size:13px;line-height:1.1;text-align:center}
#startScr{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 30% 20%,#a7f3d0 0%,#34d399 20%,#059669 60%,#022c22 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;color:#fff}
.card{background:rgba(0,0,0,0.75);backdrop-filter:blur(20px);border-radius:30px;padding:22px;border:2px solid rgba(255,255,255,0.2);max-width:380px;width:100%}
.bt{width:100%;padding:18px;border-radius:100px;border:3px solid #000;background:#facc15;color:#000;font-size:18px;font-weight:900;box-shadow:0 8px 0 #000;margin-top:14px}
.bt:active{transform:translateY(6px);box-shadow:0 2px 0 #000}
</style>
</head>
<body>
<div id="ui">
<div class="top">
<div class="pill">⬆️ <span id="hm">0</span>m</div>
<div class="pill">⭐ <span id="scm">0</span></div>
<div class="pill">🥥<span id="cm">0</span> 🍌<span id="bm">0</span></div>
</div>
<div id="bar"><div id="fill"></div></div>
<div class="pad">
<div class="j" id="left">←</div>
<div class="j" id="climbBtn">🧗<br>TAHAN<br>MANJAT</div>
<div class="j" id="right">→</div>
</div>
</div>

<div id="startScr">
<div style="font-size:90px;filter:drop-shadow(0 10px 20px rgba(0,0,0,0.5))">🐒</div>
<h1 style="font-size:36px;line-height:0.9;text-shadow:0 4px 0 #000">MONYET<br>KELAPA<br><span style="color:#facc15">4D ULTRA</span></h1>
<div class="card">
<div style="font-size:12px;line-height:1.4;color:#a7f3d0">🔥 VERSI PALING REAL! Monyet bulu halus kayak Upin Ipin The Movie 2025! Kampung Durian Runtuh full 3D! Ada ayam & Tok Dalang di bawah!</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;font-size:11px">
<div style="background:#fff;color:#000;padding:8px;border-radius:12px">✨ Bulu Real 3D<br>👀 Mata Hidup</div>
<div style="background:#fff;color:#000;padding:8px;border-radius:12px">🌴 Fisika Daun<br>💨 Angin Kampung</div>
</div>
<button class="bt" onclick="go()">🚀 MULAI - MODE 4D!</button>
<div style="font-size:10px;margin-top:10px;opacity:0.7">Pakai headphone untuk suara hutan 4D!</div>
</div>
</div>

<script type="module">
import * as THREE from 'three';
let scene,camera,renderer,clock,treeGroup,monkeyRig,leafGroup;
let obs=[],collects,particles=[],chickens=[];
let st={h:0,stam:100,score:0,coco:0,banana:0,speed:0.14,side:0,climbing:false,falling:false,playing:false};
let input={l:false,r:false,c:false};
let audio;
function initAudio(){audio=new (window.AudioContext||window.webkitAudioContext)()}
function tone(f,d,v=0.2){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(v,audio.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audio.currentTime+d);o.start();o.stop(audio.currentTime+d)}

scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x86efac,0.012);
clock=new THREE.Clock();
camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,0.1,600);
camera.position.set(0,3,7);
renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
document.body.appendChild(renderer.domElement);

// LIGHTS ULTRA
let amb=new THREE.AmbientLight(0xffffff,0.7);scene.add(amb);
let sun=new THREE.DirectionalLight(0xfff7d6,2.2);sun.position.set(20,40,15);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-30;sun.shadow.camera.right=30;sun.shadow.camera.top=30;sun.shadow.camera.bottom=-30;
scene.add(sun);
let rim=new THREE.DirectionalLight(0x60a5fa,0.8);rim.position.set(-10,15,-20);scene.add(rim);

// SKY
let sky=new THREE.Mesh(new THREE.SphereGeometry(200,32,32),new THREE.ShaderMaterial({side:THREE.BackSide,vertexShader:`varying vec3 vPos;void main(){vPos=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,fragmentShader:`varying vec3 vPos;void main(){float h=normalize(vPos).y;vec3 top=vec3(0.53,0.81,0.98);vec3 bot=vec3(0.8,0.95,0.6);vec3 col=mix(bot,top,smoothstep(-0.2,0.8,h));gl_FragColor=vec4(col,1.0);}`}));
scene.add(sky);

// GROUND - kampung real
let groundMat=new THREE.MeshStandardMaterial({color:0x4ade80,roughness:0.9,metalness:0});
let ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400,50,50),groundMat);
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;
// bump sawah
let pos=ground.geometry.attributes.position;
for(let i=0;i<pos.count;i++){let x=pos.getX(i),y=pos.getY(i);pos.setZ(i,Math.sin(x*0.08)*0.4+Math.cos(y*0.08)*0.4+Math.random()*0.2);}
pos.needsUpdate=true;ground.geometry.computeVertexNormals();
scene.add(ground);

// POHON KELAPA MEGA REAL
treeGroup=new THREE.Group();
let trunkGeo=new THREE.CylinderGeometry(0.45,0.75,36,16,20);
let trunkPos=trunkGeo.attributes.position;
for(let i=0;i<trunkPos.count;i++){let y=trunkPos.getY(i);let ang=Math.atan2(trunkPos.getZ(i),trunkPos.getX(i));let r=Math.sqrt(trunkPos.getX(i)**2+trunkPos.getZ(i)**2);let bulge=Math.sin(y*1.5)*0.05;let newR=r+bulge;trunkPos.setX(i,Math.cos(ang)*newR);trunkPos.setZ(i,Math.sin(ang)*newR);}
trunkGeo.computeVertexNormals();
let trunkMat=new THREE.MeshStandardMaterial({color:0x8d5e2b,roughness:0.8,metalness:0.1,map:makeBark()});
let trunk=new THREE.Mesh(trunkGeo,trunkMat);trunk.position.y=18;trunk.castShadow=true;trunk.receiveShadow=true;treeGroup.add(trunk);
function makeBark(){let c=document.createElement('canvas');c.width=256;c.height=512;let x=c.getContext('2d');x.fillStyle='#8d5e2b';x.fillRect(0,0,256,512);for(let i=0;i<600;i++){x.fillStyle=Math.random()>0.5?'#5d3a1a':'#a67c52';x.fillRect(Math.random()*256,Math.random()*512,Math.random()*20+4,2);}return new THREE.CanvasTexture(c)}

// DAUN KELAPA REAL - bergerak
leafGroup=new THREE.Group();leafGroup.position.y=36;
for(let i=0;i<12;i++){
 let leafStem=new THREE.Group();
 let curve=new THREE.CatmullRomCurve3([new THREE.Vector3(0,0,0),new THREE.Vector3(1.5, -0.3,0),new THREE.Vector3(3.5,-1.2,0),new THREE.Vector3(5,-1.8,0)]);
 let tube=new THREE.Mesh(new THREE.TubeGeometry(curve,12,0.08,6,false),new THREE.MeshStandardMaterial({color:0x365314,roughness:0.6}));
 leafStem.add(tube);
 for(let j=0;j<18;j++){let blade=new THREE.Mesh(new THREE.PlaneGeometry(0.7,0.12),new THREE.MeshStandardMaterial({color:j%2?0x4ade80:0x22c55e,side:THREE.DoubleSide,roughness:0.7}));let t=j/18;let p=curve.getPoint(t);blade.position.copy(p);blade.position.y+=0.12;blade.rotation.z=0.6+Math.random()*0.2;blade.rotation.y=(j%2?0.3:-0.3);leafStem.add(blade);}
 leafStem.rotation.y=i/12*Math.PI*2;leafStem.rotation.x=0.35;leafStem.userData={baseY:leafStem.rotation.y,baseX:leafStem.rotation.x,phase:Math.random()*10};
 leafGroup.add(leafStem);
}
treeGroup.add(leafGroup);
// kelapa cluster
for(let i=0;i<14;i++){let g=new THREE.Mesh(new THREE.SphereGeometry(0.32+Math.random()*0.08,14,14),new THREE.MeshStandardMaterial({color:0x3f621a,roughness:0.4,metalness:0.1}));let a=i/14*Math.PI*2+Math.random()*0.3;g.position.set(Math.cos(a)*0.6,35+Math.random()*0.8,Math.sin(a)*0.6);g.castShadow=true;treeGroup.add(g);}
scene.add(treeGroup);

// MONYET 4D - BULU & MATA HIDUP
monkeyRig=new THREE.Group();
let furMat=new THREE.MeshStandardMaterial({color:0x6b3f1d,roughness:1,metalness:0});
let skinMat=new THREE.MeshStandardMaterial({color:0xffd6b0,roughness:0.5,metalness:0});
let shirtMat=new THREE.MeshStandardMaterial({color:0xfacc15,roughness:0.6});
let pantsMat2=new THREE.MeshStandardMaterial({color:0x1d4ed8,roughness:0.7});
// body
let torso=new THREE.Mesh(new THREE.CapsuleGeometry(0.28,0.45,6,12),shirtMat);torso.position.y=0.35;torso.castShadow=true;monkeyRig.add(torso);
let belly=new THREE.Mesh(new THREE.SphereGeometry(0.22,12,12),new THREE.MeshStandardMaterial({color:0xffe4c4,roughness:0.6}));belly.position.set(0,0.25,0.18);belly.scale.set(1,0.8,0.6);monkeyRig.add(belly);
// head big
let headM=new THREE.Mesh(new THREE.SphereGeometry(0.5,20,20),skinMat);headM.position.y=1.05;headM.castShadow=true;monkeyRig.add(headM);
let snout=new THREE.Mesh(new THREE.SphereGeometry(0.22,12,12),new THREE.MeshStandardMaterial({color:0xffcc99,roughness:0.5}));snout.position.set(0,0.95,0.38);snout.scale.set(1,0.7,0.8);monkeyRig.add(snout);
let nose=new THREE.Mesh(new THREE.SphereGeometry(0.04,8,8),new THREE.MeshStandardMaterial({color:0x000000}));nose.position.set(0,1.02,0.58);monkeyRig.add(nose);
// fur top
let furTop=new THREE.Mesh(new THREE.SphereGeometry(0.52,16,16,0,Math.PI*2,0,Math.PI*1.9),furMat);furTop.position.y=1.15;furTop.rotation.x=Math.PI;monkeyRig.add(furTop);
// eyes ULTRA BIG
function eye(x){let g=new THREE.Group();let white=new THREE.Mesh(new THREE.SphereGeometry(0.15,14,14),new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.1}));let iris=new THREE.Mesh(new THREE.SphereGeometry(0.085,12,12),new THREE.MeshStandardMaterial({color:0x2d0a00,roughness:0.2}));iris.position.z=0.11;let pupil=new THREE.Mesh(new THREE.SphereGeometry(0.04,8,8),new THREE.MeshStandardMaterial({color:0x000000}));pupil.position.z=0.14;let glint=new THREE.Mesh(new THREE.SphereGeometry(0.025,6,6),new THREE.MeshBasicMaterial({color:0xffffff}));glint.position.set(0.04,0.05,0.15);g.add(white,iris,pupil,glint);g.position.set(x,1.1,0.42);return g;}
monkeyRig.add(eye(-0.18));monkeyRig.add(eye(0.18));
// ears
let earGeo=new THREE.SphereGeometry(0.16,12,12);let earL=new THREE.Mesh(earGeo,skinMat);earL.position.set(-0.48,1.05,0.05);monkeyRig.add(earL);let earR=earL.clone();earR.position.x=0.48;monkeyRig.add(earR);
// limbs with fur
let armGeo=new THREE.CapsuleGeometry(0.07,0.36,4,8);
let aL=new THREE.Mesh(armGeo,furMat);aL.position.set(-0.4,0.4,0);aL.rotation.z=0.4;aL.castShadow=true;monkeyRig.add(aL);
let aR=aL.clone();aR.position.x=0.4;aR.rotation.z=-0.4;monkeyRig.add(aR);
let legGeo=new THREE.CapsuleGeometry(0.09,0.34,4,8);
let lL=new THREE.Mesh(legGeo,furMat);lL.position.set(-0.16,-0.2,0);monkeyRig.add(lL);
let lR=lL.clone();lR.position.x=0.16;monkeyRig.add(lR);
let tailG=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(0,0,0),new THREE.Vector3(0,0.2,-0.2),new THREE.Vector3(0,0.1,-0.45)]),8,0.06,6,false),furMat);tailG.position.set(0,-0.05,-0.22);monkeyRig.add(tailG);
monkeyRig.position.set(0,1.2,0.85);monkeyRig.scale.set(1.25,1.25,1.25);scene.add(monkeyRig);

// RUMAH KAMPUNG + AYAM
for(let i=0;i<6;i++){let h=new THREE.Group();let b=new THREE.Mesh(new THREE.BoxGeometry(4,2,3),new THREE.MeshStandardMaterial({color:0x92400e}));b.position.y=1;b.castShadow=true;h.add(b);let roof=new THREE.Mesh(new THREE.ConeGeometry(3.2,1.8,4),new THREE.MeshStandardMaterial({color:0xb45309}));roof.position.y=2.9;roof.rotation.y=Math.PI/4;h.add(roof);h.position.set((Math.random()-0.5)*80,0,(Math.random()-0.5)*80-20);if(h.position.length()<10){h.position.x+=15}scene.add(h);
// ayam
let chick=new THREE.Group();let cb=new THREE.Mesh(new THREE.SphereGeometry(0.18,8,8),new THREE.MeshStandardMaterial({color:0xffffff}));let headc=new THREE.Mesh(new THREE.SphereGeometry(0.1,8,8),new THREE.MeshStandardMaterial({color:0xffffff}));headc.position.set(0.15,0.15,0);let comb=new THREE.Mesh(new THREE.SphereGeometry(0.04,6,6),new THREE.MeshStandardMaterial({color:0xff0000}));comb.position.set(0.18,0.22,0);chick.add(cb,headc,comb);chick.position.set(h.position.x+Math.random()*4-2,0.18,h.position.z+Math.random()*4-2);chick.userData={a:Math.random()*10};scene.add(chick);chickens.push(chick);
}

// GENERATE LEVEL
collects=new THREE.Group();treeGroup.add(collects);
function buildLevel(){
obs.forEach(o=>treeGroup.remove(o));obs=[];collects.clear();
for(let y=3;y<33;y+=1.2+Math.random()){
if(Math.random()<0.55){
 let type=Math.random()>0.6?'bee':'branch';
 let m;
 if(type==='branch'){m=new THREE.Mesh(new THREE.BoxGeometry(1.8+Math.random()*0.8,0.18,0.3),new THREE.MeshStandardMaterial({color:0x451a03,roughness:0.9}));m.position.set((Math.random()-0.5)*1.2,y,0.7);m.rotation.z=(Math.random()-0.5)*0.4;m.castShadow=true;}
 else{m=new THREE.Group();let body=new THREE.Mesh(new THREE.SphereGeometry(0.2,10,10),new THREE.MeshStandardMaterial({color:0xfacc15,emissive:0xfacc15,emissiveIntensity:0.2}));let stinger=new THREE.Mesh(new THREE.ConeGeometry(0.05,0.15,6),new THREE.MeshStandardMaterial({color:0x000000}));stinger.rotation.x=Math.PI;stinger.position.y=-0.18;m.add(body,stinger);m.position.set((Math.random()-0.5)*1.1,y,0.78);m.userData={phase:Math.random()*6};}
 m.userData.type=type;m.userData.y=y;obs.push(m);treeGroup.add(m);
}
if(Math.random()<0.42){
 let isCoco=Math.random()>0.5;
 let c=new THREE.Mesh(new THREE.SphereGeometry(isCoco?0.24:0.18,12,12),new THREE.MeshStandardMaterial({color:isCoco?0x65a30d:0xfacc15,roughness:0.3,metalness:0.1}));
 if(!isCoco){c.scale.set(1,1.4,1);c.material.color.set(0xffe135);}
 c.position.set((Math.random()-0.5)*0.9,y+0.5,0.85);c.userData={type:isCoco?'coco':'banana',y:y,taken:false};c.castShadow=true;
 collects.add(c);
}
}
}
buildLevel();

// PARTICLES - daun jatuh 4D
for(let i=0;i<30;i++){let p=new THREE.Mesh(new THREE.PlaneGeometry(0.2,0.1),new THREE.MeshStandardMaterial({color:0x22c55e,side:THREE.DoubleSide}));p.position.set((Math.random()-0.5)*20,15+Math.random()*20,(Math.random()-0.5)*20);p.userData={vy:-0.02-Math.random()*0.03,rx:Math.random()*0.05,ry:Math.random()*0.05};scene.add(p);particles.push(p);}

function hitCheck(){
for(let o of obs){
 if(Math.abs(o.userData.y-st.h)<0.6 && Math.abs((o.position.x||0)-st.side)<0.65){
  if(o.userData.type==='branch'){st.stam-=22;tone(80,0.4,0.4);cameraShake(0.25);}
  else{st.stam-=38;tone(200,0.5,0.4);cameraShake(0.45);}
  o.visible=false;setTimeout(()=>o.visible=true,2000);
  if(st.stam<=0){st.falling=true;}
 }
}
collects.children.forEach(c=>{
 if(!c.userData.taken && Math.abs(c.userData.y-st.h)<0.7 && Math.abs(c.position.x-st.side)<0.7){
  c.userData.taken=true;c.visible=false;
  if(c.userData.type==='coco'){st.coco++;st.score+=150;tone(523,0.15,0.3);setTimeout(()=>tone(784,0.2,0.3),90);setTimeout(()=>tone(1046,0.3,0.3),180);}
  else{st.banana++;st.score+=100;st.stam=Math.min(100,st.stam+20);tone(660,0.15);setTimeout(()=>tone(880,0.2),80);}
 }
});
}

let shake=0;
function cameraShake(a){shake=a;}

function animate(){
requestAnimationFrame(animate);
let dt=clock.getDelta();let t=clock.elapsedTime;

if(st.playing && !st.falling){
 if(st.climbing && st.stam>0){st.h+=st.speed*(1.2+st.h*0.01);st.stam-=0.18;monkeyRig.rotation.y=Math.sin(t*14)*0.2;monkeyRig.position.y=st.h+1.2+Math.sin(t*11)*0.04;}
 if(input.l)st.side=Math.max(-1.2,st.side-0.07);
 if(input.r)st.side=Math.min(1.2,st.side+0.07);
 monkeyRig.position.x=THREE.MathUtils.lerp(monkeyRig.position.x,st.side,0.15);
 monkeyRig.children[9].rotation.x=Math.sin(t*13)*0.9;monkeyRig.children[8].rotation.x=-Math.sin(t*13)*0.9;
 hitCheck();
}

leafGroup.children.forEach(l=>{l.rotation.y=l.userData.baseY+Math.sin(t*0.6+l.userData.phase)*0.12;l.rotation.x=l.userData.baseX+Math.cos(t*0.5+l.userData.phase)*0.08;});

particles.forEach(p=>{p.position.y+=p.userData.vy;p.rotation.x+=p.userData.rx;p.rotation.y+=p.userData.ry;if(p.position.y<0){p.position.y=35+Math.random()*5;p.position.x=(Math.random()-0.5)*20;}});

chickens.forEach(ch=>{ch.position.x+=Math.sin(t*0.7+ch.userData.a)*0.005;ch.rotation.y=Math.sin(t*0.5+ch.userData.a)*0.3;});

if(st.playing){
 camera.position.y=THREE.MathUtils.lerp(camera.position.y,st.h+3.2,0.08);
 camera.position.x=THREE.MathUtils.lerp(camera.position.x,st.side*0.5,0.08);
 if(shake>0){camera.position.x+=(Math.random()-0.5)*shake;camera.position.y+=(Math.random()-0.5)*shake;shake*=0.92;if(shake<0.01)shake=0;}
 camera.lookAt(st.side*0.3,st.h+1.2,0);
 document.getElementById('hm').textContent=Math.floor(st.h);
 document.getElementById('scm').textContent=st.score;
 document.getElementById('cm').textContent=st.coco;
 document.getElementById('bm').textContent=st.banana;
 document.getElementById('fill').style.width=st.stam+'%';
 if(st.h>=32.5){
  st.playing=false;document.getElementById('startScr').style.display='flex';
  document.getElementById('startScr').innerHTML=`<div class="card"><div style="font-size:60px">🏆</div><h1>BETUL BETUL BETUL! MENANG!</h1><p>Score ${st.score} - Kelapa ${st.coco} - Kampung bangga sama Kiko!</p><button class="bt" onclick="location.reload()">🔁 MAIN LAGI</button></div>`;
  tone(523,0.3);setTimeout(()=>tone(659,0.3),120);setTimeout(()=>tone(784,0.5),250);
 }
}
if(st.falling){
 st.h=Math.max(0,st.h-0.35);monkeyRig.position.y=st.h+1.2;monkeyRig.rotation.x+=0.22;monkeyRig.rotation.z+=0.18;camera.position.y=st.h+3;camera.lookAt(0,st.h,0);
 document.getElementById('hm').textContent=Math.floor(st.h);
 document.getElementById('fill').style.width=st.stam+'%';
 if(st.h<=0.2){st.falling=false;st.playing=false;document.getElementById('startScr').style.display='flex';document.getElementById('startScr').innerHTML=`<div class="card"><div style="font-size:60px">💥</div><h1>ALAMAK JATUH!</h1><p>Tinggi ${Math.floor(st.h)}m • Score ${st.score}</p><button class="bt" onclick="location.reload()">🔁 CUBA LAGI LA!</button></div>`}
}

renderer.render(scene,camera);
}
animate();

window.go=function(){initAudio();document.getElementById('startScr').style.display='none';st.playing=true;tone(440,0.2,0.3);setTimeout(()=>tone(660,0.3,0.3),100);};

let bind=(el,k)=>{let on=e=>{e.preventDefault();input[k]=true;if(k==='c')st.climbing=true;};let off=e=>{e.preventDefault();input[k]=false;if(k==='c')st.climbing=false;};el.addEventListener('touchstart',on,{passive:false});el.addEventListener('touchend',off,{passive:false});el.addEventListener('mousedown',on);el.addEventListener('mouseup',off);el.addEventListener('mouseleave',off);};
bind(document.getElementById('left'),'l');bind(document.getElementById('right'),'r');bind(document.getElementById('climbBtn'),'c');
window.addEventListener('keydown',e=>{if(e.code==='ArrowLeft')input.l=true;if(e.code==='ArrowRight')input.r=true;if(e.code==='Space'){input.c=true;st.climbing=true}});
window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft')input.l=false;if(e.code==='ArrowRight')input.r=false;if(e.code==='Space'){input.c=false;st.climbing=false}});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
